<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CONTACT US|NOVA</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Kaushan+Script&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
   <!-- <script>
        function toggleShow() {
        var menu = document.getElementById('menu')
        menu.classList.toggle('show')
      }
    </script> -->
  </head>
  <body>
     <header>
        <div class="Isotype">
            <img src="./img/Index/Isotipo.png" alt="Isotype">
        </div>
        <button class="menu-toggle" aria-label="Open navigation menu"
                aria-expanded="false" aria-controls="site-menu">
            ☰
        </button>
        <!-- <span class="mobile-menu" onclick="toggleshow()">&#8801;</span> -->
        <nav id="site-menu">
            <ul class="menu">
                <li><a href="./index.html">Studio</a></li>
                <li>
                    <a href="#">Projects</a>
                    <ul>
                        <li><a href="./Residential.html">Residential</a></li>
                        <li><a href="./Commercial.html">Commercial</a></li>
                        <li><a href="./InteriorDesign.html">Interior Design</a></li>
                    </ul>
                </li>
                <li><a href="./AboutUs.html">About Us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section>
            <div class="contactform">
                <h1> BRING YOUR VISION TO LIFE !</h1>
                <form action="https://formspree.io/f/xvkzjzjw" method="post">
                    <div class="row">
                        <label class="label" for="name">Name:</label>
                        <input name="name" type="text" class="input" required />
                        <label class="label" for="email">Email:</label>
                        <input name="email" type="text" class="input" required />
                    </div>

                    <div class="tellusproject">
                        <label for="message" class="label"><strong>TELL US ALL ABOUT IT !</strong></label>
                        <textarea
                        name="message"
                        class="message"
                        placeholder="LEAVE YOUR PROJECT DESCRIPTION HERE"
                        required
                        ></textarea>
                    </div>

                     <p> Our team at NOVA will review your proposal and get back to you within 5 business days</p>

                    <div class="button">
                        <button class="btn" type="submit">SEND</button>
                    </div>

                    <input type="hidden" name="subject" value="New Submission From: {{name}}"/>
                </form>
            </div>
        </section>

        <section class="businesscard">
            <div class="ProjectsPhotos">
                <img src="./img/contact/card1.jpg" alt="card1"> 
            </div>
            <div class="ProjectsPhotos">
                <img src="./img/contact/card2.jpg" alt="card2"> 
            </div>

        </section>
    </main>

    <footer>
        <div class="footer_info">
            &copy; NOVA
            <p>EST. 2025</p>
        </div>

        <div class="footer_socials">
            <img src="./img/Index/nova_socials.png" alt="nova_social_media">
        </div>
    </footer>
     <script>
    const menuButton = document.querySelector(".menu-toggle");
    const siteMenu = document.querySelector("#site-menu");

    menuButton.addEventListener("click", () => {
        const isOpen = siteMenu.classList.toggle("is-open");
        menuButton.setAttribute("aria-expanded", isOpen);
    });
    </script>
  </body>
